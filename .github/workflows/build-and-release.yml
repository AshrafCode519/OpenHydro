name: Build and Release OpenHydro

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Lint, tests and both builds run on every PR before it can reach main (releases stay tag-only)
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Installer & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check the dashboard stylesheet is up to date
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build:css
          git diff --exit-code --stat -- openhydro/web/css/tailwind.css || {
            echo "::error::openhydro/web/css/tailwind.css is out of date: run 'npm run build:css' and commit it"
            exit 1
          }

      # Includes the dashboard UI tests (tests/test_ui.py), which use the runner's preinstalled Edge
      - name: Lint (undefined names) and Run Tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          # The runner's clipboard is disposable; locally these tests would replace the user's clipboard
          OPENHYDRO_CLIPBOARD_TESTS: "1"
        run: |
          pip install ruff
          ruff check --select F821,F822,F823 run.py openhydro tests
          python -m unittest discover -s tests -v
          node --test tests/extension/*.test.js

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm openhydro.spec

      # The packaged app itself must start and serve its page: v1.2.2 was published crashing on
      # startup. On a tag, the app's version must also match the tag.
      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $expected = python -c "import openhydro; print(openhydro.__version__)"
          if ($env:GITHUB_REF -like "refs/tags/*" -and $env:GITHUB_REF_NAME -ne "v$expected") {
            throw "Tag $env:GITHUB_REF_NAME does not match the app version $expected"
          }
          $env:OPENHYDRO_PORT = "18765"
          $env:OPENHYDRO_DATA_DIR = Join-Path $env:RUNNER_TEMP "openhydro-smoke"
          $base = "http://127.0.0.1:18765"
          $app = Start-Process -FilePath "dist/OpenHydro/OpenHydro.exe" -ArgumentList "--headless" -PassThru
          try {
            $info = $null
            for ($i = 0; $i -lt 90 -and -not $info; $i++) {
              Start-Sleep -Seconds 1
              if ($app.HasExited) { throw "OpenHydro exited during startup (exit code $($app.ExitCode))" }
              try { $info = Invoke-RestMethod "$base/api/version" -TimeoutSec 5 } catch { }
            }
            if (-not $info) { throw "OpenHydro did not answer within 90 seconds" }
            Write-Host "Running: $($info | ConvertTo-Json -Compress)"
            if ($info.version -ne $expected) { throw "The packaged app reports $($info.version), expected $expected" }
            foreach ($path in "/", "/static/css/tailwind.css", "/static/download.html", "/api/settings") {
              $r = Invoke-WebRequest "$base$path" -UseBasicParsing -TimeoutSec 10
              Write-Host "$path -> $($r.StatusCode), $($r.RawContentLength) bytes"
            }
          } catch {
            $log = Join-Path $env:LOCALAPPDATA "OpenHydro/openhydro_crash.log"
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Compile Windows Setup Installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: installer.iss

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/OpenHydro/*" -DestinationPath "OpenHydro-windows-x64-portable.zip" -Force

      - name: Prepare Windows Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "win_artifacts"
          Get-ChildItem -Path "dist_installer\*.exe" | Copy-Item -Destination "win_artifacts\"
          Copy-Item -Path "OpenHydro-windows-x64-portable.zip" -Destination "win_artifacts\"
          Get-ChildItem -Path "win_artifacts"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: win_artifacts/*

  build-linux:
    name: Build Linux Portable Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libwebkit2gtk-4.1-dev libgtk-3-dev || sudo apt-get install -y ffmpeg libwebkit2gtk-4.0-dev || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --name OpenHydro \
            --add-data "openhydro/web:openhydro/web" \
            --add-data "openhydro/extension:openhydro/extension" \
            --add-data "assets:assets" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "starlette" \
            --hidden-import "h11" \
            --hidden-import "websockets" \
            --hidden-import "curl_cffi" \
            --hidden-import "youtube_transcript_api" \
            --collect-all "yt_dlp_ejs" \
            run.py

      - name: Package Linux Tarball
        run: |
          cp openhydro.sh dist/OpenHydro/
          cp openhydro.desktop dist/OpenHydro/
          chmod +x dist/OpenHydro/openhydro.sh
          cd dist
          tar -czvf ../OpenHydro-linux-x86_64.tar.gz OpenHydro

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: OpenHydro-linux-x86_64.tar.gz

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v7
        with:
          name: windows-release
          path: release-files/

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: release-files/

      - name: Flatten Release Files
        run: |
          find release-files -mindepth 2 -type f -exec mv -t release-files/ {} + || true
          ls -la release-files/

      # The app's update dialog shows the release notes: written ones (.github/release-notes/<tag>.md)
      # replace GitHub's generated list of pull requests
      - name: Find Release Notes
        id: notes
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then echo "path=$notes" >> "$GITHUB_OUTPUT"; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          draft: false
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}


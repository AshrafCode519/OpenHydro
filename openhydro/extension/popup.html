<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>OpenHydro Integrator</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }
    .title {
      font-weight: bold;
      color: #22d3ee;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    .btn {
      width: 100%;
      padding: 8px;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .capture {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .capture input {
      width: auto;
      margin: 0;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #1f2937;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: white;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">⚡ OpenHydro Integrator</span>
  </div>

  <div class="status">
    <div id="status-dot" class="dot"></div>
    <span id="status-text">جاري فحص الاتصال بالمحرك...</span>
  </div>

  <label class="capture">
    <input type="checkbox" id="capture-toggle" />
    <span>التقاط تحميلات المتصفح تلقائياً (برامج، فيديو، أرشيفات...)</span>
  </label>

  <input type="text" id="link-input" placeholder="ألصق رابط التحميل هنا..." />
  <button id="send-btn" class="btn" title="يفتح نافذة التنزيل في OpenHydro لاختيار الجودة">إرسال إلى OpenHydro</button>

  <script src="popup.js"></script>
</body>
</html>
